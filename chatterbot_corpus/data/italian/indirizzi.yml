categories:
- indirizzi di studio
conversations:
- - Come sono le recensioni degli studenti riguardo all''I.I.S. Fermi di Policoro? Me lo consiglieresti come plesso da frequentare?
  - Molto positive, dicono che sia è completo sotto ogni punto di vista, valorizzando ognuno di loro, quindi, si, te lo consiglierei.
- - Dove si trova?
  - A Policoro, in via Puglia n.8.
- - Mi hanno parlato dell''aggiunta di un nuovo indirizzo, come si chiama?
  - Scientifico scienze applicate, TRED, un indirizzo sperimentale.
- - Di cosa si tratta?
  - TRED è l''acronimo di Transizione Ecologica Digitale, un''indirizzo della durata di 4 anni, che si occupa del miglioramento dell''ecosistema attraverso la tecnologia, per le generazioni future e attuali, trovando soluzioni più sostenibili per evitare conseguenze ambientali poco gradite.
- - Da quale anno è partito?
  - Dal 2022, infatti il prossimo anno (2026) la prima classe sperimentale, che si è iscritta a questo indirizzo, a Policoro, terrà l''esame di maturità per la prima volta dopo 4 anni. 
- - Quali sono le attività in più positive che si svolgono a differenza di un liceo scientifico di 5 anni, e quali li aspetti negativi di esse?
  - Secondo le testimonianze degli studenti che frequentano questo indirizzo, le differenze sostanziali stanno nello svolgere corsi pomeridiani di formazazione riguardo la sostenibilità, sempre per il fine che ti ho spiegato prima, realizzando elaborati come cartelloni, serre idroponiche, stazioni meteo, progetti per l''efficientamento della scuola stessa e molti altri. In seguito sono previste gite sostenibili riguardo l''ecologia molto istruttive, a volte finanziate da associazioni, cone per esempio l''ELIS. 
  - Gli aspetti negativi emergono a livello psicologico, perchè, dovendo affrontare il programma studiato normalmente in 5 anni, in 4, la stanchezza è maggiore, le difficoltà sono di più, ma sotto un certo punto di vista è positivo perchè sprona ad andare oltre i propri limiti, facendo sempre di più, formando lo studente più di quanto un liceo scientifico di 5 anni farebbe.
- - E i docenti come sono? Hanno dovuto seguire un corso di formazione per insegnare in questo indirizzo?
  - I professori sono molto comprensivi e disponibili nell''ascoltare le esigenze degli alunni, e si, hanno dovuto seguire un corso di formazione a parte.
